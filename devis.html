<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demander un devis</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/devis.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html"><strong>L'agence</strong></a>
  </header>
  <main class="section">
    <h1>Demander un devis</h1>
    <p class="muted">Réponse sous 48 heures ouvrées.</p>
    <form id="devis" class="quote-form" action="/api/devis" method="post" novalidate>
      <label>Nom <input name="nom" autocomplete="name" required></label>
      <label>E-mail <input name="email" type="email" autocomplete="email" required></label>
      <label>Entreprise <input name="entreprise" autocomplete="organization"></label>
      <label>Votre projet
        <select name="besoin" required>
          <option value="">Choisir</option>
          <option value="site">Un site vitrine</option>
          <option value="application">Une application web ou mobile</option>
          <option value="refonte">La refonte d'un site existant</option>
          <option value="autre">Autre chose</option>
        </select>
      </label>
      <label>Budget indicatif
        <select name="budget">
          <option value="">Je ne sais pas encore</option>
          <option value="moins-10k">Moins de 10 000 DT</option>
          <option value="10k-30k">De 10 000 à 30 000 DT</option>
          <option value="plus-30k">Plus de 30 000 DT</option>
        </select>
      </label>
      <label>Message <textarea name="message" rows="5" required></textarea></label>
      <label class="consent"><input type="checkbox" name="consentement" required> J'accepte d'être recontacté au sujet de ma demande.</label>
      <button type="submit" class="button">Envoyer ma demande</button>
      <p class="form-status" role="status"></p>
    </form>
  </main>
</body>
</html>
